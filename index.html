<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WiTH ARCHITECTURE — Exterior Remodel Studio</title>
<style>
  :root {
    /* mood: studio (default light professional) */
    --bg: #F5F5F3;
    --surface: #FFFFFF;
    --surface-2: #FBFBFA;
    --ink: #1B1D22;
    --ink-muted: #666A72;
    --accent: #1E3A5F;
    --accent-ink: #FFFFFF;
    --accent-soft: #E7EEF3;
    --line: #E4E3E0;
    --line-strong: #C9C7C0;
    --shadow: 0 1px 2px rgba(20,20,25,0.05), 0 10px 28px rgba(20,20,25,0.06);
    --font-display: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR', sans-serif;
    --font-body: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR', sans-serif;
    --font-mono: 'SFMono-Regular','Consolas','Liberation Mono', monospace;
  }
  :root[data-mood="noir"] {
    --bg: #121316;
    --surface: #1A1C1F;
    --surface-2: #202226;
    --ink: #ECECEA;
    --ink-muted: #9A9CA3;
    --accent: #C9A227;
    --accent-ink: #1F1706;
    --accent-soft: #2E2712;
    --line: #2A2C30;
    --line-strong: #3C3F44;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.45);
  }
  :root[data-mood="sand"] {
    --bg: #F1ECE3;
    --surface: #FAF7F2;
    --surface-2: #FFFFFF;
    --ink: #2B241C;
    --ink-muted: #7A6F60;
    --accent: #6B3F3F;
    --accent-ink: #FBF3F0;
    --accent-soft: #EDE0DD;
    --line: #E1D8CB;
    --line-strong: #C7BBA9;
    --shadow: 0 1px 2px rgba(43,36,28,0.08), 0 10px 28px rgba(43,36,28,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  a { color: var(--accent); }

  .app-shell { max-width: 1360px; margin: 0 auto; padding: 40px 28px 80px; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 20px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px;
  }
  .version-tag {
    color: var(--accent); border: 1px solid var(--accent); border-radius: 3px;
    padding: 1px 6px; letter-spacing: 0.04em; font-weight: 700;
  }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: 34px;
    margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.02em;
  }
  .lede { color: var(--ink-muted); margin: 0; max-width: 62ch; font-size: 15px; }

  .header-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .mood-switch {
    display: inline-flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 3px;
  }
  .mood-btn {
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.03em;
    background: transparent; border: none; color: var(--ink-muted);
    padding: 7px 12px; border-radius: 4px; cursor: pointer;
  }
  .mood-btn.active { background: var(--accent); color: var(--accent-ink); }
  .reset-btn {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    background: transparent; border: 1px solid var(--line-strong); color: var(--ink-muted);
    padding: 9px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  main.layout {
    display: grid; grid-template-columns: 1fr 420px; gap: 28px; align-items: start;
  }
  @media (max-width: 980px) {
    main.layout { grid-template-columns: 1fr; }
    .output-panel { position: static !important; }
  }

  .categories { display: flex; flex-direction: column; gap: 18px; }

  .category {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow);
  }
  .category-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 6px;
  }
  .category-title { display: flex; align-items: center; gap: 10px; }
  .step-index {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 8px; border-radius: 4px; letter-spacing: 0.02em;
  }
  .category h2 { font-family: var(--font-display); font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .category .hint {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-muted);
    border: 1px solid var(--line-strong); padding: 3px 8px; border-radius: 4px; white-space: nowrap;
  }
  .category .desc { color: var(--ink-muted); font-size: 13px; margin: 2px 0 14px; }

  .category-note {
    font-size: 12.5px; color: var(--ink-muted); border-left: 2px solid var(--accent);
    padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; margin: 0 0 14px;
  }
  .category-note b { color: var(--ink); }

  .subgroup { margin-bottom: 16px; }
  .subgroup:last-child { margin-bottom: 0; }
  .subgroup-label {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .subgroup-label::before { content: ''; width: 10px; height: 1px; background: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    position: relative;
    font-family: var(--font-body); font-size: 14px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 7px; padding: 9px 30px 9px 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
  }
  .chip .en-tag {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em;
    color: var(--ink-muted); text-transform: lowercase;
  }
  .chip:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.selected .en-tag { color: var(--accent-ink); opacity: 0.78; }
  .chip.selected::after {
    content: '✓'; position: absolute; top: 8px; right: 10px; font-size: 11px;
    font-family: var(--font-mono); color: var(--accent-ink);
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip.chip-upload { padding: 0; cursor: default; overflow: hidden; }
  .chip.chip-upload .chip-label {
    padding: 9px 30px 9px 13px; cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  }
  .chip.chip-upload .chip-label:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chip.chip-upload.selected { background: var(--surface-2); color: var(--ink); border-color: var(--accent); }
  .chip.chip-upload.selected .chip-label { background: var(--accent); color: var(--accent-ink); }
  .chip.chip-upload.selected .chip-label .en-tag { color: var(--accent-ink); opacity: 0.78; }

  .chip-dropzone {
    border-top: 1px dashed var(--line-strong); padding: 8px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; min-height: 20px;
  }
  .chip-dropzone:hover { background: var(--accent-soft); }
  .chip-dropzone.dragover { background: var(--accent-soft); border-top-color: var(--accent); }
  .chip-dropzone.has-image { cursor: default; }
  .chip-drop-hint {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); letter-spacing: 0.02em;
  }
  .chip-drop-error { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); }
  .chip-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; flex-shrink: 0; display: block; }
  .chip-filename {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip-remove-btn {
    font-family: var(--font-mono); font-size: 12px; line-height: 1; background: transparent;
    border: 1px solid var(--line-strong); color: var(--ink-muted); border-radius: 4px;
    width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; padding: 0;
  }
  .chip-remove-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 사물 이미지 → 건물 변환 */
  .obj-drop {
    border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; cursor: pointer;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 36px; margin-bottom: 12px;
  }
  .obj-drop:hover, .obj-drop.dragover { background: var(--accent-soft); border-color: var(--accent); }
  .obj-item { display: inline-flex; align-items: center; gap: 6px; }
  .obj-subhead {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.04em;
    margin: 4px 0 8px;
  }
  .obj-desc {
    width: 100%; font-family: var(--font-body); font-size: 14px; margin-top: 12px;
    padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink);
  }
  .obj-desc:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .custom-wrap { margin-top: 10px; display: none; }
  .custom-wrap.show { display: block; }
  .custom-wrap input {
    width: 100%; font-family: var(--font-body); font-size: 14px;
    padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink);
  }
  .custom-wrap input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  textarea.extra-input {
    width: 100%; min-height: 64px; resize: vertical; font-family: var(--font-body);
    font-size: 14px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink);
  }
  textarea.extra-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Output panel */
  .output-panel { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }

  .ticket {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .ticket h3 {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 10px;
  }
  .ticket-pills { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
  .pill {
    font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft);
    color: var(--ink); border-radius: 4px; padding: 4px 8px; letter-spacing: 0.01em;
  }
  .ticket-empty { color: var(--ink-muted); font-size: 13px; font-style: italic; }

  .tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 5px; box-shadow: var(--shadow); }
  .tab-btn {
    flex: 1; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em;
    background: transparent; border: none; color: var(--ink-muted); padding: 10px 6px;
    border-radius: 7px; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  .prompt-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
  }
  .prompt-card h3 { font-family: var(--font-display); font-size: 16px; margin: 0; font-weight: 700; }
  .prompt-card h4 {
    font-family: var(--font-display); font-size: 13px; margin: 0; font-weight: 700;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .prompt-card .tool-note { font-size: 12.5px; color: var(--ink-muted); margin: -6px 0 0; }
  .prompt-output {
    width: 100%; min-height: 220px; font-family: var(--font-mono); font-size: 12.5px;
    line-height: 1.6; padding: 12px; border-radius: 7px; border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .prompt-output.translation { min-height: 160px; }
  .prompt-actions { display: flex; gap: 8px; align-items: center; }
  .copy-btn {
    font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em;
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 10px 16px; border-radius: 7px; cursor: pointer;
  }
  .copy-btn:hover { filter: brightness(1.08); }
  .copy-btn.copied { background: var(--ink-muted); }
  .copy-btn.secondary {
    background: transparent; color: var(--ink-muted); border: 1px solid var(--line-strong);
  }
  .copy-btn.secondary:hover { border-color: var(--accent); color: var(--accent); filter: none; }

  .translation-block {
    display: flex; flex-direction: column; gap: 10px;
    border-top: 1px dashed var(--line-strong); padding-top: 14px;
  }
  .translation-hint { font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--ink-muted); }

  .tip-box {
    font-size: 12.5px; color: var(--ink-muted); border-left: 2px solid var(--accent);
    padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0;
  }
  .tip-box b { color: var(--ink); }

  footer.note {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-muted); font-family: var(--font-mono);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="top">
    <div>
      <p class="eyebrow">Exterior Remodel · Prompt Builder <span class="version-tag">v1.7</span></p>
      <h1>WiTH ARCHITECTURE — Exterior Remodel Studio</h1>
      <p class="lede">건물 용도·스타일·외장재·조경을 하나씩 선택하면, 미드저니 · 챗GPT · 제미나이용 영어 프롬프트와 한글 번역이 오른쪽에 자동으로 완성됩니다.</p>
    </div>
    <div class="header-controls">
      <div class="mood-switch" id="moodSwitch" role="group" aria-label="화면 분위기 선택">
        <button class="mood-btn" data-mood="studio" type="button">라이트</button>
        <button class="mood-btn" data-mood="noir" type="button">다크</button>
        <button class="mood-btn" data-mood="sand" type="button">웜</button>
      </div>
      <button class="reset-btn" id="resetBtn" type="button">전체 초기화</button>
    </div>
  </header>

  <main class="layout">
    <div class="categories" id="categories"></div>

    <aside class="output-panel">
      <div class="ticket">
        <h3>선택 요약</h3>
        <div class="ticket-pills" id="ticketPills"><span class="ticket-empty">아직 선택한 항목이 없습니다</span></div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tool="mj" type="button">미드저니</button>
        <button class="tab-btn" data-tool="gpt" type="button">챗GPT</button>
        <button class="tab-btn" data-tool="gem" type="button">제미나이</button>
      </div>

      <div class="prompt-card" id="promptCard">
        <!-- filled by JS -->
      </div>
    </aside>
  </main>

  <footer class="note">모든 계산은 브라우저 안에서만 이루어지며, 선택 내용이나 사진은 어디로도 전송되지 않습니다.</footer>
</div>

  var WALL_MATERIAL_OPTIONS = [

  function objectActive() { return objectRef.images.length > 0 || !!objectRef.desc; }
  function objectModes() {

  function joinAnd(arr) {
    if (arr.length <= 1) return arr.join('');
    // 항목 안에 이미 "and"가 들어 있어서 ', plus'로 이어 붙인다
    return arr.slice(0, -1).join(', ') + ', plus ' + arr[arr.length - 1];

  // 영어: 대화형(챗GPT/제미나이)용 문단
  function objectSentenceEn(hasSource) {

    else if (n === 1) attach = (hasSource ? 'A separate photo of an object' + what + ' is also attached. ' : 'The attached image is a photo of an object' + what + '. ');
    else attach = 'The design reference is an object: ' + objectRef.desc + '. ';
    var take = modes.length ? 'translate its ' + joinAnd(modes.map(function (m) { return m.en; })) + ' into the architecture of the building' : 'translate its character into the architecture of the building';
    return attach + 'Treat this object purely as a design reference: ' + take + '. Do NOT draw the object itself, and do not make the building a literal replica or giant enlargement of it — the result must be a real, buildable building exterior that is recognisably inspired by the object.';
  }
  function objectSentenceKo(hasSource) {

    var n = objectRef.images.length;
    var attach;
    if (n > 1) attach = (hasSource ? '건물 이미지와 별도로 어떤 사물' + what + '을 여러 각도에서 찍은 사진도 함께 첨부했어. ' : '첨부한 이미지들은 어떤 사물' + what + '을 여러 각도에서 찍은 사진이야. ');
    else if (n === 1) attach = (hasSource ? '건물 이미지와 별도로 어떤 사물' + what + ' 사진도 함께 첨부했어. ' : '첨부한 이미지는 어떤 사물' + what + ' 사진이야. ');
    else attach = '디자인 참고 사물은 ' + objectRef.desc + '야. ';
    var take = modes.length ? '이 사물의 다음 요소를 건물의 건축 디자인으로 옮겨줘 — ' + modes.map(function (m) { return m.koPhrase; }).join(' / ') : '이 사물의 특징을 건물의 건축 디자인으로 옮겨줘';
    return attach + '이 사물은 디자인 참고용으로만 사용해: ' + take + '. 사물 자체를 그리지 말고, 건물을 사물의 복제품이나 거대한 확대판처럼 만들지도 마 — 결과는 실제로 지을 수 있는 건물 외관이면서, 그 사물에서 영감을 받았다는 게 알아볼 수 있어야 해.';
  }

  // ---------- Conditional categories (e.g. plan mode only for 2D drawing source) ----------
  function updateConditionalVisibility() {
    CATEGORIES.forEach(function (cat) {
      if (!cat.conditional) return;
      var controllingVal = state[cat.conditional.on];
      var show = !!controllingVal && cat.conditional.values.indexOf(controllingVal.v) !== -1;
      var sec = sectionsById[cat.id];
      sec.style.display = show ? '' : 'none';
      if (!show && state[cat.id]) {
        state[cat.id] = null;
        var selected = sec.querySelector('.chip.selected');
        if (selected) selected.classList.remove('selected');
      }
    });
  }

  function handleChipClick(cat, opt, chip, section) {
    if (cat.type === 'single' && cat.deselectable && chip.classList.contains('selected')) {
      // 이미 선택된 칩을 다시 누르면 선택 해제 (화면 비율은 "선택 안 함"이 기본 동작)
      chip.classList.remove('selected');
      state[cat.id] = null;
    } else if (cat.type === 'single') {
      var siblings = section.querySelectorAll('.chip');
      siblings.forEach(function (c) { c.classList.remove('selected'); });
      chip.classList.add('selected');
      state[cat.id] = opt;

      var cw = section.querySelector('.custom-wrap');
      if (cw) {
        if (opt.custom) {
          cw.classList.add('show');
          cw.querySelector('input').focus();
        } else {
          cw.classList.remove('show');
        }
      }
    } else {
      var isSelected = chip.classList.toggle('selected');
      if (isSelected) {
        state[cat.id].push(opt);
      } else {
        state[cat.id] = state[cat.id].filter(function (o) { return o.v !== opt.v; });
      }
    }
    updateConditionalVisibility();
    render();
  }

  function handleGroupedChipClick(cat, grp, opt, chip) {
    var arr = state[cat.id][grp.id];
    var isSelected = chip.classList.toggle('selected');
    if (isSelected) {
      arr.push(opt);
    } else {
      state[cat.id][grp.id] = arr.filter(function (o) { return o.v !== opt.v; });
    }
    render();
  }

  function handleGroupedSingleClick(cat, grp, opt, chip) {
    var allChipsInCat = sectionsById[cat.id].querySelectorAll('.chip');
    allChipsInCat.forEach(function (c) { c.classList.remove('selected'); });
    chip.classList.add('selected');
    state[cat.id] = opt;

    var cw = sectionsById[cat.id].querySelector('.custom-wrap');
    if (cw) {
      if (opt.custom) {
        cw.classList.add('show');
        cw.querySelector('input').focus();
      } else {
        cw.classList.remove('show');
      }
    }
    render();
  }

  // ---------- Source chips: click-to-select + click/drag-to-upload a reference image ----------
  function buildSourceChips(section, cat) {
    var wrap = document.createElement('div');
    wrap.className = 'chips';

    cat.options.forEach(function (opt) {
      var chip = document.createElement('div');
      chip.className = 'chip chip-upload';
      chip.dataset.cat = cat.id;
      chip.dataset.val = opt.v;

      var label = document.createElement('div');
      label.className = 'chip-label';
      label.setAttribute('role', 'button');
      label.tabIndex = 0;
      var inner = '<span>' + opt.ko + '</span>';
      if (opt.en) inner += '<span class="en-tag">' + opt.en + '</span>';
      label.innerHTML = inner;
      label.addEventListener('click', function () { selectSourceOption(cat, opt, chip); });
      label.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSourceOption(cat, opt, chip); }
      });
      chip.appendChild(label);

      var drop = document.createElement('div');
      drop.className = 'chip-dropzone';
      chip.appendChild(drop);
      renderDropzone(drop, opt);

      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.style.display = 'none';
      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (f) attachSourceImage(cat, opt, chip, f);
        fileInput.value = '';
      });
      chip.appendChild(fileInput);

      drop.addEventListener('click', function (e) {
        e.stopPropagation();
        fileInput.click();
      });
      ['dragenter', 'dragover'].forEach(function (evt) {
        drop.addEventListener(evt, function (e) {
          e.preventDefault(); e.stopPropagation();
          drop.classList.add('dragover');
        });
      });
      ['dragleave', 'dragend'].forEach(function (evt) {
        drop.addEventListener(evt, function (e) {
          e.preventDefault(); e.stopPropagation();
          drop.classList.remove('dragover');
        });
      });
      drop.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        drop.classList.remove('dragover');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) attachSourceImage(cat, opt, chip, f);
      });

      wrap.appendChild(chip);
    });

    section.appendChild(wrap);
  }

  function renderDropzone(drop, opt) {
    var img = state.sourceImages[opt.v];
    if (img) {
      drop.classList.add('has-image');
      drop.innerHTML =
        '<img class="chip-thumb" src="' + img.dataUrl + '" alt="">' +
        '<span class="chip-filename">' + escapeHtml(img.name) + '</span>' +
        '<button type="button" class="chip-remove-btn" aria-label="이미지 제거">×</button>';
      drop.querySelector('.chip-remove-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        state.sourceImages[opt.v] = null;
        renderDropzone(drop, opt);
      });
    } else {
      drop.classList.remove('has-image');
      drop.innerHTML = '<span class="chip-drop-hint">클릭 또는 드래그로 이미지 첨부</span>';
    }
  }

  function attachSourceImage(cat, opt, chip, file) {
    var drop = chip.querySelector('.chip-dropzone');
    if (!file.type || file.type.indexOf('image/') !== 0) {
      drop.innerHTML = '<span class="chip-drop-error">이미지 파일만 첨부할 수 있어요</span>';
      setTimeout(function () { renderDropzone(drop, opt); }, 1800);
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      state.sourceImages[opt.v] = { name: file.name, dataUrl: reader.result };
      renderDropzone(drop, opt);
      selectSourceOption(cat, opt, chip);
    };
    reader.readAsDataURL(file);
  }

  function selectSourceOption(cat, opt, chip) {
    var siblings = sectionsById[cat.id].querySelectorAll('.chip');
    siblings.forEach(function (c) { c.classList.remove('selected'); });
    chip.classList.add('selected');
    state[cat.id] = opt;
    updateConditionalVisibility();
    render();
  }

  // ---------- Prompt builders (English primary) ----------
  function buildMidjourneyEN() {
    var typeEn = resolvedEn('buildingType') || '[building type not selected]';
    var styleEn = resolvedEn('style') || '[style not selected]';
    var sourceVal = state.source ? state.source.v : null;

    var planModeVal = state.planMode ? state.planMode.v : null;

    var intro, viewpointTag, siteTag;
    if (sourceVal === 'plan' && planModeVal === 'full') {
      intro = "based on the attached 2D architectural drawing, a rendered full aerial/bird's-eye view of the entire site plan with the landscaping, fence/gate position, parking spaces, and driveway already drawn on the plan kept in place and the building's walls and roof raised, viewed from an elevated angle, centered on a";
      viewpointTag = "single consistent aerial/bird's-eye viewpoint matching the site plan, the entire site visible at once, not an eye-level exterior shot";
      siteTag = 'landscaping, fence/gate position, parking spaces, and driveway exactly matching the layout drawn on the site plan, do not add, remove, or move any of these elements';
    } else if (sourceVal === 'plan' && planModeVal === 'part') {
      intro = 'based only on the facade/portion marked or highlighted in the attached 2D drawing (ignore the rest of the drawing), a rendered eye-level exterior view of that single designated';
      viewpointTag = "single consistent eye-level exterior viewpoint for only the marked facade/portion, matching that portion's layout on the drawing";
      siteTag = 'landscaping, fence/gate position, parking spaces, and driveway exactly matching the layout drawn on the plan for that portion, do not add, remove, or move any of these elements';
    } else if (sourceVal === 'plan') {
      intro = 'based on the attached 2D architectural drawing, a rendered exterior view of a';
      viewpointTag = 'single consistent eye-level exterior viewpoint that matches the drawing';
      siteTag = 'landscaping, fence/gate position, parking spaces, and driveway exactly matching the layout drawn on the plan, do not add, remove, or move any of these elements';
    } else if (sourceVal === 'bare') {
      intro = 'transform this bare, under-construction building exterior photo into a finished';
      viewpointTag = 'camera angle, lens perspective and viewpoint unchanged from the original photo';
      siteTag = null;
    } else if (sourceVal === 'existing') {
      intro = 'redesign this existing building exterior photo into a';
      viewpointTag = 'camera angle, lens perspective and viewpoint unchanged from the original photo';
      siteTag = null;
    } else if (sourceVal === 'sketchup') {
      intro = 'develop this white, untextured SketchUp massing model into a fully finished, materialized';
      viewpointTag = 'camera angle, lens perspective and viewpoint unchanged from the original SketchUp model view';
      siteTag = 'exact massing, proportions, window and door openings, and roof form already modeled in SketchUp — do not alter the geometry, only add real-world materials, color, texture, and surface detail';
    } else {
      intro = 'a';
      viewpointTag = null;
      siteTag = null;
    }

    var parts = [];
    parts.push(intro + ' ' + typeEn + ', ' + styleEn + ' exterior architectural design');

    var renderStyleEnMj = renderStylePromptEn();
    parts.push(renderStyleEnMj || 'photorealistic architectural exterior photography, ultra-detailed, architectural digest quality, 8k');

    var conceptEn = listEn('concept');
    if (conceptEn.length) parts.push('featuring ' + conceptEn.join(', '));

      lines = lines.concat(detailLines);
    }

    lines.push('');
    if (renderStyleKoLong) {
      lines.push('※ 표현 기법 지시 (다시 한번 강조): ' + renderStyleKoLong);
    } else {
      lines.push('결과물은 실제 준공 후 촬영한 것처럼 사실적이고 디테일하게 표현해줘.');
    }

    return lines.join('\n');
  }

  var TOOL_META = {
    mj: {
      label: '미드저니',
      note: 'Discord의 /imagine 창에 사진을 함께 첨부하거나, 이미지를 먼저 업로드해 받은 URL을 프롬프트 맨 앞 [PASTE IMAGE URL HERE] 자리에 붙여넣으세요.',
      buildEn: buildMidjourneyEN,
      buildKo: buildMidjourneyKO
    },
    gpt: {
      label: '챗GPT',
      note: '대화창에 원본 외관 사진(또는 도면)을 첨부한 뒤, 아래 영어 프롬프트를 그대로 붙여넣으세요.',
      buildEn: function () { return buildConversationalEN(false); },
      buildKo: function () { return buildConversationalKO(false); }
    },
    gem: {
      label: '제미나이',
      note: '제미나이(나노바나나)에 원본 외관 사진(또는 도면)을 첨부한 뒤, 아래 영어 프롬프트를 그대로 붙여넣으세요. 사진 편집 특성상 구조를 그대로 유지하도록 구성했습니다.',
      buildEn: function () { return buildConversationalEN(true); },
      buildKo: function () { return buildConversationalKO(true); }
    }
  };

  // ---------- Render ----------
  var promptCard = document.getElementById('promptCard');
  var ticketPills = document.getElementById('ticketPills');

  function render() {
    // ticket
    var pills = [];
    if (state.source) pills.push(state.source.ko);
    if (state.planMode) pills.push(state.planMode.ko);
    var t = resolvedKo('buildingType'); if (t) pills.push(t);
    var st = resolvedKo('style'); if (st) pills.push(st);
    listKo('concept').forEach(function (v) { pills.push(v); });
    var p = resolvedKo('palette'); if (p) pills.push(p);
    ['wall', 'roof', 'window'].forEach(function (g) {
      state.material[g].forEach(function (o) { pills.push(o.ko); });
    });
    var l = resolvedKo('lighting'); if (l) pills.push(l);
    var rs = resolvedKo('renderStyle'); if (rs) pills.push(rs);
    if (state.aspect) pills.push('비율 ' + state.aspect.ko);
    if (objectActive()) pills.push('사물→건물' + (objectRef.desc ? ' · ' + objectRef.desc : ''));
    var dz = resolvedKo('designer'); if (dz) pills.push(dz);

    if (pills.length) {
      ticketPills.innerHTML = pills.map(function (t) { return '<span class="pill">' + escapeHtml(t) + '</span>'; }).join('');
    } else {
      ticketPills.innerHTML = '<span class="ticket-empty">아직 선택한 항목이 없습니다</span>';
    }

    // prompt card
    var meta = TOOL_META[activeTool];
    var textEn = meta.buildEn();
    var textKo = meta.buildKo();
    promptCard.innerHTML =
      '<h3>' + meta.label + '용 프롬프트 (English)</h3>' +
      '<p class="tool-note">' + meta.note + '</p>' +
      '<textarea class="prompt-output" id="promptOutputEn" spellcheck="false">' + escapeHtml(textEn) + '</textarea>' +
      '<div class="prompt-actions"><button class="copy-btn" id="copyBtnEn" type="button">영어 프롬프트 복사</button></div>' +
      '<div class="translation-block">' +
        '<h4>한글 번역 <span class="translation-hint">참고용 — 실제 입력은 위 영어 프롬프트를 사용하세요</span></h4>' +
        '<textarea class="prompt-output translation" id="promptOutputKo" spellcheck="false">' + escapeHtml(textKo) + '</textarea>' +
        '<div class="prompt-actions"><button class="copy-btn secondary" id="copyBtnKo" type="button">한글 번역 복사</button></div>' +
      '</div>' +
      '<div class="tip-box"><b>Tip.</b> 건물 용도·스타일만 선택해도 프롬프트가 만들어져요. 나머지 항목은 선택할수록 결과가 더 구체적이고 정교해집니다.</div>';

    document.getElementById('copyBtnEn').addEventListener('click', function () {
      copyText(document.getElementById('promptOutputEn').value, this, '영어 프롬프트 복사');
    });
    document.getElementById('copyBtnKo').addEventListener('click', function () {
      copyText(document.getElementById('promptOutputKo').value, this, '한글 번역 복사');
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function copyText(text, btn, originalLabel) {
    var done = function () {
      btn.textContent = '복사됨!';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = originalLabel; btn.classList.remove('copied'); }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }

  render();
})();
</script>
</body>
</html>
